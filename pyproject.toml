[project]
name = "rag-eval-py"
version = "0.1.0"
description = "Score any RAG pipeline: retrieval precision + answer faithfulness"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pydantic>=2.0", "rich>=13.0", "typer>=0.12"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
judge = ["openai>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pytest-cov"]

[project.scripts]
rag-eval = "rag_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.hatch.envs.default]
features = ["dev", "api"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
lint = "ruff check {args:src tests}"
typecheck = "mypy {args:src tests}"
